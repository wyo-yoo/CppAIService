<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡码AI助手</title>
<style>
    /* 全局样式 */
    body {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f5f5;
        color: #333;
    }

    h1.title {
        font-size: 36px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 30px;
        background: linear-gradient(to right, #007bff, #00c6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .container {
        width: 360px;
        padding: 25px;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        box-sizing: border-box;
        text-align: center;
        transition: all 0.3s;
    }

    .container:hover {
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #333;
    }

    .form-group {
        margin-bottom: 18px;
        text-align: left;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        color: #555;
        margin-bottom: 5px;
    }

    .form-group input {
        width: calc(100% - 20px);
        padding: 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #f9f9f9;
        outline: none;
        transition: all 0.2s;
    }

    .form-group input:focus {
        border-color: #007bff;
        box-shadow: 0 0 8px rgba(0,123,255,0.3);
        background: #fff;
    }

    .btn {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
    }

    .btn:hover {
        background-color: #0056b3;
        transform: scale(1.03);
    }

    .switch {
        margin-top: 15px;
        font-size: 14px;
        color: #666;
    }

    .switch a {
        color: #007bff;
        text-decoration: none;
        cursor: pointer;
    }

    .switch a:hover { text-decoration: underline; }

    #register-container { display: none; }

    /* 成功提示框 */
    #success-alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #007bff;
        color: #fff;
        padding: 12px 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        display: none;
        z-index: 1000;
        font-weight: bold;
    }
</style>
</head>
<body>
<div id="success-alert">提示信息</div>

<div>
    <h1 class="title">卡码AI助手</h1>

    <!-- 登录 -->
    <div class="container" id="login-container">
        <h2>登录</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">用户名</label>
                <input type="text" id="login-username" autocomplete="username" maxlength="255" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" autocomplete="current-password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="switch">
            没有账号？<a id="register-link" onclick="showRegister()">去注册账号</a>
        </div>
    </div>

    <!-- 注册 -->
    <div class="container" id="register-container">
        <h2>注册</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="register-username">用户名</label>
                <input type="text" id="register-username" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" placeholder="3–32 位字母、数字或下划线" required>
            </div>
            <div class="form-group">
                <label for="register-password">密码</label>
                <input type="password" id="register-password" autocomplete="new-password" minlength="15" maxlength="128" placeholder="15–128 个字符，建议使用长句" required>
            </div>
            <button type="submit" class="btn">注册</button>
        </form>
        <div class="switch">
            已有账号？<a onclick="showLogin()">返回登录</a>
        </div>
    </div>
</div>

<script>
function showAlert(message){
    const alertBox = document.getElementById('success-alert');
    alertBox.textContent = message;
    alertBox.style.display = 'block';
    setTimeout(()=>{alertBox.style.display='none';},5000);
}
function showRegister(){ document.getElementById('login-container').style.display='none'; document.getElementById('register-container').style.display='block'; }
function showLogin(){ document.getElementById('register-container').style.display='none'; document.getElementById('login-container').style.display='block'; }

async function submitAccount(form, endpoint) {
    const register = endpoint === '/register';
    const prefix = register ? 'register' : 'login';
    const username = document.getElementById(prefix+'-username').value.trim();
    const password = document.getElementById(prefix+'-password').value;
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
        const response = await fetch(endpoint, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username,password})
        });
        const data = await response.json();
        if (!response.ok || data.success === false) throw new Error(data.message || '操作失败，请稍后重试');
        if (register) {
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = '';
            document.getElementById('register-password').value = '';
            showLogin(); showAlert('注册成功，请使用新账号登录');
        } else {
            sessionStorage.setItem('userId', data.userId);
            window.location.href='/chat';
        }
    } catch(error) { showAlert(error.message || '网络连接失败，请稍后重试'); }
    finally { button.disabled = false; }
}
document.getElementById('login-form').addEventListener('submit', function(e) { e.preventDefault(); submitAccount(this,'/login'); });
document.getElementById('register-form').addEventListener('submit', function(e) { e.preventDefault(); submitAccount(this,'/register'); });
fetch('/api/config').then(r=>r.json()).then(config=>{
    if (!config.registrationOpen) {
        const link = document.getElementById('register-link');
        link.textContent = '新用户注册暂时关闭'; link.removeAttribute('onclick');
    }
}).catch(()=>{});
</script>
</body>
</html>
